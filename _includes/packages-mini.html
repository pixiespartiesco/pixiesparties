<div class="container" id="booking">
	<div class="text-center">
		<h2 class="page-section-heading d-inline-block">
			<i class="fa-solid fa-star" style="font-size: medium;vertical-align: middle;"></i> Party Packages <i class="fa-solid fa-star" style="font-size: medium;vertical-align: middle;"></i>
		</h2>
	</div>
	<div class="card bg-light text-secondary mb-3 text-small">
		{% for post in site.data.packages.packages %}
		<div class="row g-0">
			<div class="col-md-4">
				<img src="{{ post.image }}" class="img rounded-start h-100 w-100 m-0 d-block" alt="{{ post.title }}">
			</div>
			<div class="col-md-8">
				<div class="card-body">
					<p class="card-text fw-bold mb-1">{{ post.title }} </p>
					<p class="card-text mb-1">{{ post.duration }} | {{ post.price }}</p>
					<p class="card-text mb-1 fs-6 lh-sm">{{ post.description }}</p>
				</div>
			</div>
		</div>
		{% endfor %}
	</div>
</div>
