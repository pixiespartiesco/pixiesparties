- category: Packages, Add-Ons & Pricing
  items:
    - question: How much does a character party cost in Calgary?
      answer: "Pixies Parties offers two main party packages: the 60-minute Classic Package for $250 CAD and the 90-minute Deluxe Package for $350 CAD. Both packages include activities and supplies for up to 10 children."
    - question: What is the difference between the Classic and Deluxe packages?
      answer: The Classic Package ($250) includes 60 minutes of interactive storytelling, games, singing, and photo opportunities. The Deluxe Package ($350) extends the visit to 90 minutes and adds extras such as a Royal Coronation ceremony and Glitter Tattoos.
    - question: What specific activities are included in your party packages?
      answer: Our parties are highly interactive and feature a grand character entrance, story time, sing-alongs (for appropriate characters), themed games, a craft activity (supplies included for 10 children), princess makeup or glitter tattoos, and a magical birthday song ceremony.
    - question: What if we have more than 10 children attending?
      answer: Both the Classic and Deluxe packages include supplies for up to 10 children. Additional guests are $10 per child so every child receives full party supplies and participation time. I recommend a maximum of 15 children for the Classic Package and 20 children for the Deluxe Package to ensure a quality experience for all guests.
    - question: How long do your children's character parties typically last?
      answer: I offer flexible package durations to suit your event, including our popular Classic Party (60 minutes) and our Deluxe Party (90 minutes). I also offer longer options for corporate or large public events.
    - question: Can I add a photo backdrop or shorter visit option?
      answer: Yes! Alongside our Classic and Deluxe parties, we offer shorter Character Meet & Greets, Virtual Visits, and an 8' x 10' Castle Photo Backdrop add-on ($80), where our team arrives early before your party to set it up.
    - question: What types of children's party entertainment do you specialize in?
      answer: I specialize in premium princess parties and enchanting fairytale themes, but our lineup also includes other popular character options. Check our [Characters](/characters) page to see our full, enchanting cast!

- category: Booking, Travel & Policies
  items:
    - question: How do I book a princess or character party in Calgary?
      answer: Booking is easy! Simply visit our [Booking Page](/#booking) to select your desired date, time, and character. You can also reach out via our [Contact Form](/contact) for any questions or special requests.
    - question: How far in advance should I book, and is a deposit required?
      answer: We recommend booking 4 to 6 weeks in advance—especially for weekend dates—though last-minute availability is sometimes open. A $100 non-refundable deposit secures your date and character, with the remaining balance due before your event.
    - question: Which cities and areas do you serve?
      answer: Pixies Parties is proudly based in Calgary and happily travels to surrounding areas across Southern Alberta. A small [Travel Fee](/travelfees) may apply if your event location is outside the immediate Calgary city limits.
    - question: How early does the performer arrive?
      answer: Your performer arrives in full character costume right at your scheduled booking start time, ready to make a magical entrance. I recommend scheduling the character arrival 30 to 45 minutes after your party begins so all guests have arrived.
    - question: Can parties be held outdoors or at a park?
      answer: Yes, I perform at homes, community halls, and outdoor parks. For outdoor events, I ask that you provide a shaded area and have an indoor backup plan in case of inclement weather or extreme temperatures.
    - question: What if the weather is bad for our outdoor party?
      answer: I strongly recommend having an indoor backup venue ready for all outdoor events. I do not offer refunds for inclement weather. However, I will gladly work with you to find an alternative indoor solution or to reschedule the party (rescheduling fee applies).
    - question: What is your cancellation and rescheduling policy?
      answer: The $100 deposit is non-refundable. Please see our [Cancellation Policy Page](/cancellation) for full details on changes, rescheduling fees, and how I handle emergencies.

- category: Characters, Safety & Party Experience
  items:
    - question: What do I need to provide at my home or venue for the performer?
      answer: Very little! Your performer brings their own portable speaker, storybooks, craft supplies, and games. We just ask for a clear indoor or shaded outdoor space (roughly 8' x 8') where children can sit in a circle for story time and dance comfortably, plus access to a small table or floor area for crafts.
    - question: Do parents need to stay during the party?
      answer: Yes, Pixies Parties provides interactive entertainment rather than childcare. We ask that at least one parent or supervising adult remain present in the room throughout the character's visit.
    - question: What is your policy regarding adding a second character?
      answer: As a dedicated solo performer, I currently focus on one magical character per event to ensure the highest quality of individual experience. Our performer brings an abundance of magic, activities, and excitement for all the children!
    - question: What age groups are your parties best suited for?
      answer: Our parties are perfectly tailored for children aged 4 to 10, but our experienced entertainers can adapt activities to ensure fun and engagement for a wider range of ages, from toddlers to tweens.
    - question: Do you provide costumes or accessories for the children?
      answer: While children are absolutely encouraged to dress up and join the fun, Pixies Parties provides the character and supplies for the craft/activity, but not costumes for the children to wear.
    - question: Do you create custom characters not listed on your website?
      answer: I currently focus on perfecting our existing character offerings to ensure a truly magical experience. However, I am happy to consider custom requests! Please fill out our [Contact Form](/contact) with details about the character you are looking for. I will review your request and do my best to accommodate it for your event.
    - question: What safety and hygiene measures are your performers taking?
      answer: The safety of the children is our top priority. Our entertainers are fully vaccinated and adhere to all current safety and hygiene guidelines to ensure a safe, enchanting party experience for everyone.
    - question: Can you accommodate children with special needs or allergies?
      answer: Yes, I strive to create inclusive experiences for all children. Please inform us of any special requirements or allergies when booking, and I will do my very best to adapt the activities to ensure a safe and magical experience for every child.
    - question: Is tipping customary for the performer?
      answer: Tipping is never expected, though always deeply appreciated if you feel your performer made your child's celebration extra magical!