# Site settings
title: Pixies Parties
email: contact@pixiesparties.ca
description: >- # This means to ignore newlines until "baseurl:"
  Hire the best children's party entertainers in Calgary! 
  Pixies Parties offers princess, superhero, and character visits for unforgettable kids' birthday parties. 
  Book your party today!
#baseurl: "/your-project-name" # the subpath of your site, e.g. /blog
url: "https://www.pixiesparties.ca" # the base hostname & protocol for your site
logo: /assets/img/logo.webp

social:
  - name: Facebook
    url: https://www.facebook.com/pixiespartiesyyc
  - name: Instagram
    url: https://www.instagram.com/pixiesparties/
  - name: TikTok
    url: https://www.tiktok.com/@pixiesparties

lang: en_CA
og_locale: en_CA

# Theme settings
#theme: minima # Or your chosen theme, e.g., jekyll-theme-minimal

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Defaults for front matter
defaults:
  - scope:
      path: "_posts" # An empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"
      author: "Erin Mackey"
  - scope:
      path: "_characters"
      type: "characters"
    values:
      layout: "character"

# Collections (optional)
collections:
  characters:
    output: true
    permalink: /characters/:name/
    order:
      - cinderella.md
      - snowhite.md
      - belle.md
      - rapunzel.md
      - ariel.md
      - elsa.md
      - anna.md
  cities:
    output: true
    permalink: /:slug/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag