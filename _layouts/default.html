<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link rel="canonical" href="{{site.url}}{{page.url}}">
  <meta name="description" content="{{page.description}}">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  {% seo %}

  <!-- Custom Location Meta Tags (Supplementary to jekyll-seo-tag) -->
  {% if page.city %}
  <meta name="geo.placename" content="{{ page.city }}, {{page.province}}, Canada">
  <meta name="geo.region" content="CA-AB">
  {% endif %}

  {% include scripts.html %}
  {% include schema.html %}
</head>

<body id="page-top" class="bg-primary text-white d-flex flex-column min-vh-100">
  {% include navbar.html %}
  {% include masthead.html %}
  <div class="container bg-primary text-white" id="about">
    {{ content }}
  </div>
  {% include footer.html %}
</body>

</html>
